<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Newsletter Subscription</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .subscribe-card {
      width: 100%;
      max-width: 450px;
      padding: 30px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .subscribe-card h2 {
      margin: 0 0 8px;
      color: #111827;
      font-size: 26px;
    }

    .subscribe-card p {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      display: block;
      margin-bottom: 16px;
    }

    .form-group span {
      display: block;
      margin-bottom: 6px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      border: 1px solid #d4d4d8;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
    }

    .subscribe-button {
      width: 100%;
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .subscribe-button:hover {
      background: #1f2937;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>

  <div class="subscribe-card">
    <h2>Subscribe to our newsletter</h2>

    <p>
      Enter your details to receive the latest news and updates.
    </p>

    <form
      action="https://sabnode.com/api/sabmail/forms/6a3a4ed5079f797abb67f5d7/submit"
      method="POST"
    >
      <label class="form-group">
        <span>Email</span>

        <input
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </label>

      <label class="form-group">
        <span>Name</span>

        <input
          name="name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        >
      </label>

      <button class="subscribe-button" type="submit">
        Subscribe
      </button>
    </form>
  </div>

</body>
</html>
