<form action="https://sabnode.com/api/sabmail/forms/6a3a4ed5079f797abb67f5d7/submit" method="POST">
  <label style="display:block;margin:0 0 12px">
    <span style="display:block;margin:0 0 4px;font:14px/1.4 sans-serif">Email</span>
    <input name="email" type="email" required style="width:100%;padding:8px 10px;font:14px/1.4 sans-serif;border:1px solid #d4d4d8;border-radius:6px" />
  </label>
  <label style="display:block;margin:0 0 12px">
    <span style="display:block;margin:0 0 4px;font:14px/1.4 sans-serif">Name</span>

  </label>
  <button type="submit" style="padding:9px 16px;font:14px/1.4 sans-serif;border:0;border-radius:6px;background:#111827;color:#fff;cursor:pointer">Subscribe</button>
</form>
